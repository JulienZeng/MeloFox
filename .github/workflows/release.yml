name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本 tag，例如 v1.2.3 或 v1.2.3-beta.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  prepare:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '9.15.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Check registry configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo '请配置仓库变量 DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo '请配置仓库 Secret DOCKERHUB_TOKEN'; exit 1; }
      - name: Resolve and stamp tag version
        id: version
        run: node scripts/release.mjs prepare "$RELEASE_TAG" --verify-tag
      - name: Reject an already published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs check "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release.mjs package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release/melofox-${{ steps.version.outputs.version }}.tar.gz
            release/melofox-${{ steps.version.outputs.version }}.zip
            release/docker-compose.yml
            release/melofox.env.example
            release/build-info.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  image:
    name: Docker · ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Stamp the same version into the Docker build context
        run: node scripts/release.mjs prepare "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build natively and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # 必须使用工作目录，默认 Git context 会忽略刚写入的版本号。
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ vars.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=MeloFox
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=melofox-${{ matrix.arch }}
          cache-to: type=gha,scope=melofox-${{ matrix.arch }},mode=max
          provenance: mode=min
      - name: Check packaged version and launch Chromium
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --network none --entrypoint node -e EXPECTED_VERSION="$VERSION" "$DOCKERHUB_IMAGE@$DIGEST" --input-type=module -e '
            import assert from "node:assert/strict";
            import { getVersionInfo } from "./dist/runtime/version.js";
            import { chromium } from "playwright";
            assert.equal(getVersionInfo().app_version, process.env.EXPECTED_VERSION);
            assert.equal(getVersionInfo().protocol_version, "11");
            const browser = await chromium.launch({ headless: true });
            await browser.close();
          '
          mkdir -p .release/digests
          printf '%s\n' "$DIGEST" > ".release/digests/${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: .release/digests/*.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: .release/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Merge image manifests and publish all Release assets
        run: node scripts/publish-release.mjs publish

  latest:
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 正式版本发布互不阻塞；只有 latest 别名串行更新，旧 tag 不会使其降级。
    concurrency:
      group: melofox-latest
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point Docker latest and GitHub Latest to the highest stable release
        run: node scripts/publish-release.mjs latest
