services:
  # MeloFox 服务；保留历史服务名及数据卷名，兼容已有部署和服务发现。
  douyin-onebot:
    image: ${IMAGE_NAME:-melofox}:${IMAGE_TAG:-latest}
    # 本地单架构可 docker compose build；多架构/构建代理见 .build.env 和 build-multiarch.sh。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-douyin-onebot}
    restart: unless-stopped
    shm_size: ${DOCKER_SHM_SIZE:-1gb}
    stop_grace_period: ${DOCKER_STOP_GRACE_PERIOD:-120s}
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    # Compose 2.24+：.env 可省略，仅在尚无持久化设置时导入应用参数。
    env_file:
      - path: ${MELOFOX_INIT_ENV_FILE:-.env}
        required: false
    environment:
      # 仅保留容器启动定位和首次初始化的固定路径/端口；业务参数由控制台保存。
      MELOFOX_CONFIG_DIR: /data/config
      NODE_ENV: production
      DOUYIN_ONEBOT_CONFIG: /app/config/config.example.yaml
      DOUYIN_ONEBOT_ENV_FILE: ""
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
      WEB_DATA_DIR: /data/console
      BROWSER_USER_DATA_DIR: /data/douyin-profile
      BROWSER_HEADLESS: "true"
      ONEBOT_HTTP_HOST: 0.0.0.0
      ONEBOT_HTTP_PORT: "3001"
      ONEBOT_FORWARD_WS_HOST: 0.0.0.0
      ONEBOT_FORWARD_WS_PORT: "3002"
      MEDIA_CACHE_DIR: /data/media-cache
      RUNTIME_MESSAGE_CACHE_DIR: /data/message-cache
    volumes:
      # 命名卷继承镜像 /data 的 pwuser 权限，不依赖宿主机目录属主。
      - douyin-data:/data
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
      - "${ONEBOT_HTTP_BIND:-127.0.0.1}:${ONEBOT_HTTP_PORT:-3001}:3001"
      - "${ONEBOT_FORWARD_WS_BIND:-127.0.0.1}:${ONEBOT_FORWARD_WS_PORT:-3002}:3002"

volumes:
  douyin-data:
    name: ${DOCKER_DATA_VOLUME:-douyin-onebot-data}
