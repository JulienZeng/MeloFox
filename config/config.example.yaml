# 可选的首次导入模板；保存 settings.json 后不再读取，运行参数请在控制台设置页修改。
web:
  enabled: true
  host: "127.0.0.1"
  port: 3000
  dataDir: "./data/console"

app:
  selfId: "douyin_bot_001"
  logLevel: "info"
  # pretty：易读文本；json：结构化日志。Docker 与本机默认一致。
  logFormat: "pretty"
  # 收发日志是否显示最多 180 字符的内容摘要；false 仅显示对象和消息类型。
  logMessageContent: true

browser:
  userDataDir: "./douyin-profile"
  headless: true
  douyinUrl: "https://www.douyin.com/"

douyin:
  messagePageUrl: "https://www.douyin.com/chat"
  hookMode: "network"

onebot:
  # *_rate_limited 接口共用当前账号队列；单位毫秒。
  rateLimitIntervalMs: 500
  accessToken: ""
  http:
    enabled: true
    host: "127.0.0.1"
    port: 3001
    publicBaseUrl: "http://127.0.0.1:3001"
  reverseWs:
    enabled: false
    url: "ws://127.0.0.1:6700/onebot/v11/ws"
  reverseHttp:
    enabled: false
    url: "http://127.0.0.1:5701"
    secret: ""
    timeoutMs: 10000
  forwardWs:
    enabled: true
    host: "127.0.0.1"
    port: 3002
  mediaCache:
    dir: "./media-cache"
    ttlMs: 604800000
    cleanupIntervalMs: 600000
    maxBytes: 1073741824
    maxFiles: 1000
    maxFileBytes: 134217728
    transcodeVideoToH264: true
    ffmpegPath: "ffmpeg"

# 媒体下载代理，不代理浏览器或 OneBot 连接。
network:
  httpProxy: ""
  httpsProxy: ""
  noProxy: "localhost,127.0.0.1,::1"

runtime:
  reconnectIntervalMs: 5000
  actionTimeoutMs: 15000
  heartbeatIntervalMs: 30000
  sessionCheckIntervalMs: 30000
  imDisconnectGraceMs: 60000
  messageCacheLimit: 10000
  messageCacheTtlMs: 604800000
  messageCachePersist: true
  messageCacheDir: "./message-cache"
  messageCacheFlushIntervalMs: 5000
