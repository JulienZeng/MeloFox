syntax = "proto3";

message DyStrangerMsgResponse {
  int32 code = 1;
  int32 sub_code = 2;
  int32 error_code = 3;
  string status = 4;
  int32 version = 5;
  MessageData data = 6;
  string trace_id = 7;
  int64 timestamp = 10;
  int64 server_time = 11;
  int64 user_id = 13;
}

message MessageData {
  MessageInfo message_info = 1000;
}

message MessageInfo {
  int32 msg_type = 1;
  int32 msg_status = 2;
  int32 content_type = 3;
  repeated MessageContent content = 4;
}

message MessageContent {
  int64 conversation_short_id = 1;
  int32 msg_version = 2;
  MessageDetail detail = 3;
  string conversation_id = 4;
  repeated UserInfo users = 5;
}

message MessageDetail {
  string conversation_id = 1;
  int32 conversation_type = 2;
  int64 server_message_id = 3;
  int64 create_time = 4;
  int64 conversation_short_id = 5;
  int32 content_type = 6;
  int64 conversation_id_int = 7;
  string text_content = 8;
  repeated MessageProperty properties = 9;
  int64 client_create_time = 10;
  int32 read_status = 11;
  int32 deleted = 12;
  int64 create_time_ns = 13;
  string receiver_sec_uid = 14;
  int32 message_status = 17;
}

message MessageProperty {
  string key = 1;
  string value = 2;
}

message UserInfo {
  int64 user_id = 1;
  string sec_uid = 5;
}
